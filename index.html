<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Rahmat Hidayat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        .cv-container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 26px;
            letter-spacing: 1px;
        }

        h2 {
            color: #007bff;
            font-size: 18px;
            border-left: 4px solid #007bff;
            padding-left: 10px;
            margin-top: 25px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        td {
            padding: 8px 5px;
            vertical-align: top;
        }

        .table-data td:first-child {
            width: 35%;
            font-weight: 600;
            color: #555;
        }

        .table-data td:nth-child(2) {
            width: 5%;
            text-align: center;
        }

        .table-pendidikan tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .table-pendidikan td {
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="cv-container">
        <div class="header">
            <img src="IMG-20250328-WA0110.jpg" alt="Foto Profil Rahmat Hidayat" class="profile-img" />
            <h1>RIWAYAT HIDUP</h1>
        </div>

        <!-- Bagian Data Pribadi -->
        <h2>Data Pribadi</h2>
        <table class="table-data">
            <tr>
                <td>Nama</td>
                <td>:</td>
                <td>Rahmat Hidayat</td>
            </tr>
            <tr>
                <td>Tempat, Tanggal Lahir</td>
                <td>:</td>
                <td>Tanjung Enim, 18 November 2006</td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td>Laki-Laki</td>
            </tr>
            <tr>
                <td>Agama</td>
                <td>:</td>
                <td>Islam</td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td>:</td>
                <td>Majalengka</td>
            </tr>
            <tr>
                <td>Nomor Telepon</td>
                <td>:</td>
                <td>0857-9786-2959</td>
            </tr>
        </table>

        <h2>Riwayat Pendidikan</h2>
        <table class="table-pendidikan">
            <tr>
                <td>SMAT MANAHIJUL HUDA</td>
            </tr>
            <tr>
                <td>SMPN 1 MALAUSMA</td>
            </tr>
            <tr>
                <td>SDN 20 LAWANG KIDUL</td>
            </tr>
        </table>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
